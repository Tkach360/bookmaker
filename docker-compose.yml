services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # проверяет, что порты реально принимают соединения
      # (ping проверяет только, что Erlang-нода жива)
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - app-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
      args:
        SERVICE: gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - BROKER_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - app-network

  bets:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        SERVICE: bets
    container_name: bets
    environment:
      - BROKER_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      events:
        condition: service_started # events объявляет очередь events.requests
    restart: on-failure
    networks:
      - app-network

  events:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      args:
        SERVICE: events
    container_name: events
    environment:
      - BROKER_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
